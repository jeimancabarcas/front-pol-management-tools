<div class="h-screen w-screen overflow-hidden flex flex-col bg-white text-[#161616]">
  <!-- Top Navbar Organism -->
  <app-navbar (toggleSidebar)="toggleSidebar()" />

  <!-- Body Section: Fixed Height with internal scroll -->
  <div class="flex-1 flex overflow-hidden min-h-0 w-full">
    <!-- Left Sidebar Organism -->
    <app-sidebar
      [isOpen]="isSidebarOpen()"
      (closeMobile)="closeMobileSidebar()"
    />

    <!-- Main Content Area with its own isolated scroll -->
    <main
      class="flex-1 overflow-y-auto overflow-x-hidden min-w-0 h-full bg-white focus:outline-none"
      tabindex="-1"
    >
      <div class="w-full max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <ng-content />
        <router-outlet />
      </div>
    </main>
  </div>
</div>
