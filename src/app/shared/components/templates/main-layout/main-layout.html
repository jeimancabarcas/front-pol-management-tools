<div class="min-h-screen flex flex-col bg-white text-[#161616]">
  <!-- Top Navbar Organism -->
  <app-navbar (toggleSidebar)="toggleSidebar()" />

  <!-- Body Section: Sidebar + Main Content -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Left Sidebar Organism -->
    <app-sidebar
      [isOpen]="isSidebarOpen()"
      (closeMobile)="closeMobileSidebar()"
    />

    <!-- Main Content Area with Scroll -->
    <main class="flex-1 overflow-y-auto bg-white min-h-[calc(100dvh-3.5rem)] focus:outline-none" tabindex="-1">
      <div class="w-full max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <ng-content />
        <router-outlet />
      </div>
    </main>
  </div>
</div>
