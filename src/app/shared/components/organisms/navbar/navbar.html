<header class="w-full h-14 bg-white border-b border-[#e0e0e0] px-3 sm:px-4 flex items-center justify-between flex-shrink-0 sticky top-0 z-30 select-none">
  <!-- Left: Mobile Toggle & Brand Logo -->
  <div class="flex items-center gap-2 sm:gap-3 min-w-0">
    <!-- Mobile sidebar toggle -->
    <button
      type="button"
      (click)="toggleSidebar.emit()"
      aria-label="Toggle Navigation Menu"
      class="lg:hidden p-2 text-[#525252] hover:text-[#161616] hover:bg-[#f4f4f4] rounded transition-colors flex-shrink-0 cursor-pointer"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Brand Logo -->
    <a routerLink="/" class="flex items-center gap-2 no-underline group min-w-0">
      <div class="w-8 h-8 rounded bg-[#0f62fe] flex items-center justify-center text-white shadow-sm flex-shrink-0">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 7h16M4 12h16M4 17h10" stroke-linecap="round" />
          <rect x="2" y="3" width="20" height="18" rx="2" stroke-width="1.5" stroke="currentColor" fill="none" opacity="0.4" />
        </svg>
      </div>
      <div class="flex items-baseline gap-1.5 whitespace-nowrap min-w-0">
        <span class="font-semibold text-base tracking-tight text-[#161616] group-hover:text-[#0f62fe] transition-colors">
          AssetFlow
        </span>
        <span class="hidden sm:inline text-[#e0e0e0] font-light">|</span>
        <span class="hidden sm:inline text-xs text-[#525252] font-normal tracking-normal">
          Control de Bienes
        </span>
      </div>
    </a>
  </div>

  <!-- Center: Search Bar -->
  <div class="hidden md:flex flex-1 max-w-xl mx-6">
    <div class="relative w-full">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-[#525252]">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <input
        type="search"
        (input)="onSearch($event)"
        placeholder="Buscar bienes, seriales o comprobantes..."
        class="w-full h-10 pl-9 pr-4 text-xs sm:text-sm bg-[#f4f4f4] border-b-2 border-transparent focus:border-[#0f62fe] focus:bg-white text-[#161616] placeholder-[#8d8d8d] outline-none transition-all"
      />
    </div>
  </div>

  <!-- Right: Actions & User Info -->
  <div class="flex items-center gap-1.5 sm:gap-3 flex-shrink-0">
    <!-- Notification Bell -->
    <button
      type="button"
      aria-label="Notificaciones"
      class="relative p-2 text-[#525252] hover:text-[#161616] hover:bg-[#f4f4f4] rounded-full transition-colors cursor-pointer"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      <!-- Notification indicator badge -->
      <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-[#0f62fe] rounded-full ring-2 ring-white"></span>
    </button>

    <!-- User Profile Badge -->
    <div class="flex items-center gap-2 pl-1 sm:pl-2 border-l border-[#e0e0e0] py-1 cursor-pointer hover:bg-[#f4f4f4] px-1 sm:px-2 rounded transition-colors">
      <div class="relative w-8 h-8 rounded-full overflow-hidden bg-[#e0e0e0] flex-shrink-0 flex items-center justify-center text-xs font-semibold text-[#161616]">
        <img
          src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&h=120&q=80"
          alt="Administrador"
          class="w-full h-full object-cover"
          onerror="this.style.display='none'"
        />
        <span>AD</span>
      </div>
      <div class="hidden sm:flex flex-col text-left">
        <span class="text-xs font-semibold text-[#161616] leading-tight">
          Administrador
        </span>
        <span class="text-[11px] text-[#525252] font-normal leading-tight">
          Sede Central
        </span>
      </div>
    </div>
  </div>
</header>
